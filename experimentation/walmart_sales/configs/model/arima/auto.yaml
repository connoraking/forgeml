# @package model
# Let pmdarima choose p/d/q on each training window using an AIC stepwise search.
# Seasonal search is configurable, but requires enough cycles in every CV fold.
name: auto_arima
label: auto_arima
use_exog: false
params:
  search:
    start_p: 0
    start_q: 0
    max_p: 2
    max_q: 2
    d: null
    max_d: 2
    seasonal: false
    m: 1
    start_P: 0
    start_Q: 0
    max_P: 1
    max_Q: 1
    D: null
    information_criterion: aic
    stepwise: true
    maxiter: 50
