# @package _global_
# Run this with -m sweep=arima_orders. Two choices per axis produce four jobs.
defaults:
  - override /model: arima

evaluation:
  cv:
    enabled: true

hydra:
  sweeper:
    params:
      # Each [p,d,q] and [P,D,Q,s] is one choice, not three/four separate axes.
      model.params.order: "[0,1,0],[1,1,0]"
      model.params.seasonal_order: "[0,0,0,0],[1,0,0,7]"
