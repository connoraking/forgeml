# Compose each model family from its manifest and default settings.
defaults:
  - models/naive: manifest
  - models/arima: manifest
  - _self_
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

# Change the name when copying this experiment; derived paths follow it.
experiment:
  name: example
  root: experimentation/${experiment.name}

task: forecasting

# Add new cases on each launch; reuse completed fits with matching input data.
# Set rerun=true to refit the currently selected cases. Earlier cases are retained.
execution:
  rerun: false

# Prepare one chronological series using explicit columns and aggregation.
data:
  loader: csv
  source:
    provider: local
    directory: ${experiment.root}/data
  path: ${data.source.directory}/series.csv
  date_column: date
  target_column: value
  frequency: D
  filters: {}
  known_future_columns: []
  aggregate: null

# Reserve holdout first, then run CV strictly inside earlier history.
evaluation:
  metrics: [mae, rmse, rmsle, mape, smape, wape]
  holdout:
    enabled: true
    test_size: 0.2
  cv:
    enabled: true
    n_splits: 3
    horizon: 7
    step: 7
    min_train_size: 28

# Descriptive analysis runs separately from fitting.
eda:
  directory: ${results.directory}/eda
  seasonal_period: 7
  stl_robust: true
  max_lags: 30
  rolling_window: 7
  difference_lag: 1
  start_date: null
  end_date: null

results:
  directory: ${experiment.root}/results

artifacts:
  directory: ${experiment.root}/artifacts

# Launcher settings; fitted model names are controlled by the pipeline.
hydra:
  output_subdir: null
  run:
    dir: .
  sweep:
    dir: ${artifacts.directory}/sweeps
    subdir: .
  job:
    chdir: false

# Enable model families here. Each family manifest controls its own sweep.
models:
  naive:
    enabled: true
  arima:
    enabled: true
