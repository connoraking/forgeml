# Copy this experiment directory, change experiment.name, and configure real data.
# Model and sweep files are resolved within this config directory.
defaults:
  - model: naive
  - _self_
  - sweep: null
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled

experiment:
  name: example
  # Changing the name moves data/output paths together. Override root if needed.
  root: experimentation/${experiment.name}

task: forecasting

data:
  loader: csv
  source:
    provider: local
    directory: ${experiment.root}/data
  # Supply your own real CSV. The template does not generate or download data.
  path: ${data.source.directory}/series.csv
  date_column: date
  target_column: value
  frequency: D
  filters: {}
  known_future_columns: []
  # Leave null for one row per date; otherwise declare column aggregation rules.
  aggregate: null

evaluation:
  metrics: [mae, rmse, mape, smape, wape]
  holdout:
    enabled: true
    test_size: 0.2
  cv:
    enabled: false
    n_splits: 3
    horizon: 7
    step: 7
    min_train_size: 28

eda:
  directory: ${results.directory}/eda
  # This example assumes daily observations with a weekly cycle. Change both
  # data.frequency and the seasonal periods to match your dataset.
  seasonal_period: 7
  stl_robust: true
  max_lags: 30
  rolling_window: 7
  difference_lag: 1
  start_date: null
  end_date: null

results:
  directory: ${experiment.root}/results
artifacts:
  directory: ${experiment.root}/artifacts
run:
  # null names results using model parameters, filters, and evaluation settings.
  name: null

# Launcher housekeeping. No working-directory changes or timestamped run folders.
hydra:
  output_subdir: null
  run:
    dir: .
  sweep:
    dir: ${artifacts.directory}/sweeps
    subdir: .
  job:
    chdir: false
