[project]
name = "forgeml"
version = "0.1.0"
description = "A small, configuration-driven machine learning experimentation framework"
readme = "README.md"
authors = [
    { name = "connoraking", email = "ckingdata@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.7",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "omegaconf>=2.3.1",
    "pandas>=3.0.6",
    "pmdarima>=2.1.1",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
